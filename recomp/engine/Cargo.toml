[package]
name = "lcs_engine"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementations of GTA: LCS engine functions, linked into the recompiled game"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false

[profile.dev]
panic = "abort"
